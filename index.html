<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nifty Neat — Labour Logger</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #181818;
    --surface2: #222222;
    --border: #2e2e2e;
    --accent: #f0c040;
    --accent2: #e05a2b;
    --text: #f0ede8;
    --muted: #888;
    --success: #4caf72;
    --danger: #e05a2b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 14px;
    display: flex;
    align-items: flex-end;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 2px;
    color: var(--accent);
    line-height: 1;
  }

  .logo span {
    color: var(--muted);
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    display: block;
    letter-spacing: 3px;
    margin-top: 2px;
  }

  .header-date {
    margin-left: auto;
    text-align: right;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }

  /* ── Main ── */
  main {
    padding: 20px 16px 100px;
    max-width: 500px;
    margin: 0 auto;
  }

  /* ── Type Selector ── */
  .type-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }

  .type-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 16px 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    color: var(--text);
  }

  .type-btn:hover { border-color: var(--accent); }

  .type-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e0e0e;
  }

  .type-btn .type-icon {
    font-size: 22px;
    margin-bottom: 8px;
    display: block;
  }

  .type-btn .type-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'IBM Plex Mono', monospace;
    display: block;
  }

  .type-btn .type-sub {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 2px;
    display: block;
  }

  /* ── Form Sections ── */
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    margin-top: 20px;
  }

  /* ── Employee Grid ── */
  .employee-search {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.15s;
  }

  .employee-search:focus { border-color: var(--accent); }
  .employee-search::placeholder { color: var(--muted); }

  .employee-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    max-height: 220px;
    overflow-y: auto;
    padding-right: 2px;
  }

  .employee-grid::-webkit-scrollbar { width: 3px; }
  .employee-grid::-webkit-scrollbar-track { background: var(--surface); }
  .employee-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .emp-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 9px 6px;
    cursor: pointer;
    color: var(--text);
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    text-align: center;
    transition: all 0.12s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .emp-btn:hover { border-color: var(--accent); color: var(--accent); }
  .emp-btn.active { background: var(--accent); border-color: var(--accent); color: #0e0e0e; font-weight: 500; }
  .emp-btn.hidden { display: none; }

  /* ── Payer Toggle ── */
  .payer-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .payer-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 14px;
    cursor: pointer;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
    text-align: center;
    transition: all 0.15s;
  }

  .payer-btn:hover { border-color: var(--accent); }
  .payer-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }

  /* ── Amount Input ── */
  .amount-wrap {
    position: relative;
  }

  .amount-input {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 16px 60px 16px 16px;
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 2px;
    outline: none;
    transition: border-color 0.15s;
  }

  .amount-input:focus { border-color: var(--accent); }
  .amount-input::placeholder { color: var(--border); }

  .amount-currency {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* ── Quick amounts ── */
  .quick-amounts {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .quick-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .quick-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Date Input ── */
  .date-input {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }

  .date-input:focus { border-color: var(--accent); }
  .date-input::-webkit-calendar-picker-indicator { filter: invert(0.6); }

  /* ── Note input ── */
  .note-input {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
    resize: none;
    height: 60px;
  }

  .note-input:focus { border-color: var(--accent); }
  .note-input::placeholder { color: var(--muted); }

  /* ── Submit ── */
  .submit-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    padding: 18px;
    color: #0e0e0e;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    cursor: pointer;
    margin-top: 24px;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .submit-btn:hover { background: #ffd050; transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--success);
    color: #fff;
    padding: 14px 24px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 999;
    text-align: center;
    max-width: 90vw;
  }

  .toast.error { background: var(--danger); }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Recent log ── */
  .recent-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 36px;
    margin-bottom: 12px;
  }

  .recent-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .clear-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    letter-spacing: 1px;
  }

  .clear-btn:hover { color: var(--danger); }

  .log-list { display: flex; flex-direction: column; gap: 6px; }

  .log-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .log-item .log-who {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
  }

  .log-item .log-type {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .log-item .log-amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    text-align: right;
    color: var(--text);
  }

  .log-item .log-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align: right;
  }

  /* ── Setup banner ── */
  .setup-banner {
    background: var(--surface);
    border: 1.5px dashed var(--border);
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 24px;
    display: none;
  }

  .setup-banner.show { display: block; }

  .setup-banner p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 10px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .setup-banner input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    outline: none;
    margin-bottom: 8px;
  }

  .setup-banner input:focus { border-color: var(--accent); }

  .setup-save-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 16px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .setup-save-btn:hover { border-color: var(--accent); color: var(--accent); }

  .gear-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    padding: 4px;
    transition: color 0.15s;
  }

  .gear-btn:hover { color: var(--accent); }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 6px 0 20px;
  }

  /* ── Form panels ── */
  .form-panel { display: none; }
  .form-panel.active { display: block; }

  /* ── Expense type toggle ── */
  .expense-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 4px;
  }

  .expense-type-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    cursor: pointer;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-align: center;
    transition: all 0.15s;
  }

  .expense-type-btn:hover { border-color: var(--accent2); color: var(--text); }
  .expense-type-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
</style>
</head>
<body>

<header>
  <div class="logo">
    NIFTY
    <span>LABOUR LOGGER</span>
  </div>
  <div class="header-date" id="headerDate"></div>
  <button class="gear-btn" onclick="toggleSetup()" title="Settings">⚙</button>
</header>

<main>

  <!-- Setup Banner -->
  <div class="setup-banner" id="setupBanner">
    <p>// GOOGLE SHEETS SETUP</p>
    <p>Paste your Google Apps Script Web App URL below to enable auto-sync to your sheet.</p>
    <input type="url" id="scriptUrl" placeholder="https://script.google.com/macros/s/YOUR_ID/exec" />
    <br>
    <button class="setup-save-btn" onclick="saveScriptUrl()">SAVE URL</button>
  </div>

  <!-- Entry Type -->
  <p class="section-label">Entry Type</p>
  <div class="type-grid">
    <button class="type-btn active" onclick="selectType('advance-sajawal', this)">
      <span class="type-icon">💰</span>
      <span class="type-label">Advance</span>
      <span class="type-sub">By Sajawal</span>
    </button>
    <button class="type-btn" onclick="selectType('advance-zubair', this)">
      <span class="type-icon">💸</span>
      <span class="type-label">Advance</span>
      <span class="type-sub">By Zubair</span>
    </button>
    <button class="type-btn" onclick="selectType('fuel', this)">
      <span class="type-icon">⛽</span>
      <span class="type-label">Fuel</span>
      <span class="type-sub">Expense</span>
    </button>
    <button class="type-btn" onclick="selectType('overhead', this)">
      <span class="type-icon">🔧</span>
      <span class="type-label">Overhead</span>
      <span class="type-sub">Expense</span>
    </button>
  </div>

  <div class="divider"></div>

  <!-- ADVANCE PANEL -->
  <div class="form-panel active" id="panel-advance">
    <p class="section-label">Employee</p>
    <input class="employee-search" type="text" placeholder="Search employee..." oninput="filterEmployees(this.value)" />
    <div class="employee-grid" id="employeeGrid"></div>
  </div>

  <!-- EXPENSE PANEL -->
  <div class="form-panel" id="panel-expense">
    <p class="section-label">Expense Category</p>
    <div class="expense-toggle">
      <button class="expense-type-btn active" onclick="selectExpenseType('fuel', this)">⛽ FUEL</button>
      <button class="expense-type-btn" onclick="selectExpenseType('overhead', this)">🔧 OVERHEAD</button>
    </div>
    <p class="section-label" style="margin-top:16px">Note (optional)</p>
    <textarea class="note-input" id="expenseNote" placeholder="e.g. Generator fuel, Gas refill, Tools..."></textarea>
  </div>

  <!-- AMOUNT (shared) -->
  <p class="section-label" style="margin-top:20px">Amount</p>
  <div class="amount-wrap">
    <input class="amount-input" type="number" id="amountInput" placeholder="0" min="0" />
    <span class="amount-currency">AED</span>
  </div>
  <div class="quick-amounts">
    <button class="quick-btn" onclick="setAmount(50)">50</button>
    <button class="quick-btn" onclick="setAmount(100)">100</button>
    <button class="quick-btn" onclick="setAmount(150)">150</button>
    <button class="quick-btn" onclick="setAmount(200)">200</button>
    <button class="quick-btn" onclick="setAmount(300)">300</button>
    <button class="quick-btn" onclick="setAmount(500)">500</button>
  </div>

  <!-- DATE -->
  <p class="section-label">Date</p>
  <input class="date-input" type="date" id="dateInput" />

  <!-- SUBMIT -->
  <button class="submit-btn" id="submitBtn" onclick="submitEntry()">LOG ENTRY</button>

  <!-- RECENT LOG -->
  <div class="recent-header">
    <span class="recent-title">// Recent Entries</span>
    <button class="clear-btn" onclick="clearLog()">CLEAR</button>
  </div>
  <div class="log-list" id="logList">
    <p style="color:var(--muted);font-size:12px;font-family:'IBM Plex Mono',monospace;text-align:center;padding:20px 0;">No entries yet</p>
  </div>

</main>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ──
const EMPLOYEES = [
  'Bir','Bahadur','Phoolchan','Bimlesh','Suresh',
  'Santosh CH','Permanand','Guddu','Santosh P','Rabin',
  'Shayam','Weyema','Abdo','Nura','Kelvin',
  'George','Joel','Irsad','Mattia','Abu Bakar',
  'Claude','Ronald'
];

let currentType = 'advance-sajawal';
let selectedEmployee = null;
let selectedExpenseSubtype = 'fuel';
let recentLog = JSON.parse(localStorage.getItem('nifty_log') || '[]');

// ── Init ──
function init() {
  // Set today's date
  const today = new Date();
  document.getElementById('dateInput').value = today.toISOString().split('T')[0];

  // Header date
  document.getElementById('headerDate').innerHTML =
    today.toLocaleDateString('en-GB', {weekday:'short',day:'numeric',month:'short'}).toUpperCase() +
    '<br>' + today.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});

  // Build employee grid
  buildEmployeeGrid(EMPLOYEES);

  // Render log
  renderLog();

  // Show setup if no URL saved
  if (!localStorage.getItem('nifty_script_url')) {
    document.getElementById('setupBanner').classList.add('show');
  }
}

// ── Employee Grid ──
function buildEmployeeGrid(list) {
  const grid = document.getElementById('employeeGrid');
  grid.innerHTML = '';
  EMPLOYEES.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'emp-btn' + (list.includes(name) ? '' : ' hidden');
    btn.textContent = name;
    btn.dataset.name = name;
    btn.onclick = () => selectEmployee(name, btn);
    grid.appendChild(btn);
  });
}

function filterEmployees(q) {
  const filtered = EMPLOYEES.filter(n => n.toLowerCase().includes(q.toLowerCase()));
  document.querySelectorAll('.emp-btn').forEach(btn => {
    btn.classList.toggle('hidden', !filtered.includes(btn.dataset.name));
  });
}

function selectEmployee(name, btn) {
  selectedEmployee = name;
  document.querySelectorAll('.emp-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Type Selection ──
function selectType(type, btn) {
  currentType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const isAdvance = type.startsWith('advance');
  document.getElementById('panel-advance').classList.toggle('active', isAdvance);
  document.getElementById('panel-expense').classList.toggle('active', !isAdvance);

  if (type === 'fuel') selectedExpenseSubtype = 'fuel';
  if (type === 'overhead') selectedExpenseSubtype = 'overhead';

  // Sync expense panel buttons
  if (!isAdvance) {
    document.querySelectorAll('.expense-type-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.expense-type-btn').forEach(b => {
      if ((type === 'fuel' && b.textContent.includes('FUEL')) ||
          (type === 'overhead' && b.textContent.includes('OVERHEAD'))) {
        b.classList.add('active');
      }
    });
  }

  selectedEmployee = null;
  document.querySelectorAll('.emp-btn').forEach(b => b.classList.remove('active'));
}

function selectExpenseType(type, btn) {
  selectedExpenseSubtype = type;
  document.querySelectorAll('.expense-type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Amount ──
function setAmount(val) {
  document.getElementById('amountInput').value = val;
}

// ── Submit ──
async function submitEntry() {
  const amount = parseFloat(document.getElementById('amountInput').value);
  const date = document.getElementById('dateInput').value;
  const isAdvance = currentType.startsWith('advance');

  // Validation
  if (!amount || amount <= 0) { showToast('Enter a valid amount', true); return; }
  if (!date) { showToast('Select a date', true); return; }
  if (isAdvance && !selectedEmployee) { showToast('Select an employee', true); return; }

  const paidBy = currentType === 'advance-zubair' ? 'Zubair' : 'Sajawal';
  const expType = isAdvance ? 'advance' : selectedExpenseSubtype;
  const note = document.getElementById('expenseNote')?.value || '';

  const entry = {
    type: expType,
    employee: isAdvance ? selectedEmployee : null,
    paidBy: isAdvance ? paidBy : 'Sajawal',
    amount,
    date,
    note,
    timestamp: new Date().toISOString()
  };

  // Add to local log
  recentLog.unshift(entry);
  localStorage.setItem('nifty_log', JSON.stringify(recentLog.slice(0, 50)));
  renderLog();

  // Try sending to Google Sheets
  const scriptUrl = localStorage.getItem('nifty_script_url');
  if (scriptUrl) {
    try {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SYNCING...';

      await fetch(scriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(entry)
      });

      btn.disabled = false;
      btn.textContent = 'LOG ENTRY';
      showToast('✓ Logged & synced to sheet!');
    } catch(e) {
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').textContent = 'LOG ENTRY';
      showToast('Saved locally — sync failed', true);
    }
  } else {
    showToast('✓ Entry saved locally');
  }

  // Reset
  document.getElementById('amountInput').value = '';
  document.getElementById('expenseNote') && (document.getElementById('expenseNote').value = '');
  selectedEmployee = null;
  document.querySelectorAll('.emp-btn').forEach(b => b.classList.remove('active'));
}

// ── Log ──
function renderLog() {
  const list = document.getElementById('logList');
  if (recentLog.length === 0) {
    list.innerHTML = '<p style="color:var(--muted);font-size:12px;font-family:\'IBM Plex Mono\',monospace;text-align:center;padding:20px 0;">No entries yet</p>';
    return;
  }

  list.innerHTML = recentLog.slice(0, 15).map(e => {
    const dateStr = e.date ? new Date(e.date + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric',month:'short'}) : '—';
    const who = e.employee || (e.type === 'fuel' ? '⛽ Fuel' : '🔧 Overhead');
    const typeLabel = e.type === 'advance'
      ? `Advance · ${e.paidBy}`
      : e.type === 'fuel' ? 'Fuel Expense' : 'Overhead Expense';
    return `
      <div class="log-item">
        <div>
          <div class="log-who">${who}</div>
          <div class="log-type">${typeLabel}${e.note ? ' · ' + e.note : ''}</div>
        </div>
        <div>
          <div class="log-amount">${e.amount}</div>
          <div class="log-date">${dateStr}</div>
        </div>
      </div>`;
  }).join('');
}

function clearLog() {
  if (confirm('Clear recent entries list? (Does not affect your sheet)')) {
    recentLog = [];
    localStorage.removeItem('nifty_log');
    renderLog();
  }
}

// ── Toast ──
function showToast(msg, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (error ? ' error' : '') + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Setup ──
function toggleSetup() {
  const banner = document.getElementById('setupBanner');
  banner.classList.toggle('show');
  if (banner.classList.contains('show')) {
    const saved = localStorage.getItem('nifty_script_url');
    if (saved) document.getElementById('scriptUrl').value = saved;
  }
}

function saveScriptUrl() {
  const url = document.getElementById('scriptUrl').value.trim();
  if (!url) { showToast('Paste a valid URL', true); return; }
  localStorage.setItem('nifty_script_url', url);
  document.getElementById('setupBanner').classList.remove('show');
  showToast('✓ Script URL saved!');
}

init();
</script>
</body>
</html>
